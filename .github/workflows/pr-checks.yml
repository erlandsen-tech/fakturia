name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public build-time values. Already committed in fly.toml - these are
      # safe to embed in workflow YAML. Runtime secrets live on Fly.
      NEXT_PUBLIC_BASE_URL: https://fakturio.no
      NEXT_PUBLIC_SUPABASE_URL: https://xemufotqckljtkqoqbsf.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlbXVmb3RxY2tsanRrcW9xYnNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NjQzMjUsImV4cCI6MjA5MzU0MDMyNX0.BQMPHIf4M30mF9202DMfSq-AHCc3yv_k7R_yyorDHvo
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_51T91lFGczqI2tDLn2iAXYdf0lAk7A9ssakNoruMsyChyxgRF3GY8kPBGbit1m5Rp4FuCEkxeqX8U6ysTPZFQhAsd00F6pdJhFP
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
